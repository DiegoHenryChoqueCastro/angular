
<section class="tienda-hero" aria-label="Novedades de la Tienda">
    <!-- Imagen de Fondo Principal -->
    <div class="tienda-hero__bg">
        <img 
            class="tienda-hero__img" 
            src="{{ sliderStore }}" 
            alt="Estadio iluminado de noche con luces brillantes"
            loading="eager"
        />
        <div class="tienda-hero__overlay" aria-hidden="true"></div>
    </div>

    <!-- Contenido Principal -->
    <div class="tienda-hero__container">
        <article class="tienda-card">
            <div class="tienda-card__badge">
                <span class="tienda-card__badge-dot"></span>
                Colección Oficial
            </div>
            
            <h1 class="tienda-card__titulo">
                Equipaciones <span>2026</span>
            </h1>
            
            <p class="tienda-card__texto">
                Demuestra tu pasión incondicional dentro y fuera del campo. Descubre la nueva tecnología y diseño de vanguardia.
            </p>
            
            <a href="#comprar" class="tienda-card__btn" role="button" aria-label="Comprar equipaciones oficiales 2026">
                Comprar Ahora
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                </svg>
            </a>
        </article>
    </div>
</section>

<app-swiper></app-swiper>
<app-shop></app-shop>
